# Builds the CCD client and server Docker images, pushes them to ACR, and
# restarts the production deployments so they pull the newly published images.
# Triggered by the `save-the-children` git tag.
#
# Targets the UNICEF-managed `mdp-hotpot-common` agent pool (Ubuntu).
# Script blocks use PowerShell Core (pwsh: true) since Windows PowerShell
# is not installed on Ubuntu; the commands used (Set-Location, Move-Item,
# Copy-Item, Out-File) are all cross-platform under pwsh.
#
# Required Azure DevOps configuration:
#   * Variable group `ccd-save-the-children` (or rename below) holding the
#     client build-time variables: API_URL, DIRECTUS_URL, DIRECTUS_TOKEN,
#     AUTH_PROVIDER, B2C_TENANT, B2C_CLIENT_ID, B2C_USER_FLOW, B2C_REDIRECT_URI.
#     Mark DIRECTUS_TOKEN as a secret.
#   * Docker Registry service connection — `azureSubscription` below.
#     Set its value to the name of the connection that points at ACR.
#   * Agent must have Docker installed and reachable from the pipeline user.
#   * The AKS service connection below must be authorized for this pipeline.

trigger:
  branches:
    exclude:
      - '*'
  tags:
    include:
      - save-the-children

pr: none

pool: 'mdp-hotpot-common'

variables:
  - group: ccd-save-the-children
  - name: imageTag
    value: save-the-children
  - name: azureSubscription
    value: 'unicrmenarohotpotcommon'
  - name: imageRepository
    value: init/ccd-data-portal/image
  - name: aksServiceConnection
    value: 'UNI_MENA_RO RG-MENA-RO-HotPot-PRD'
  - name: aksResourceGroup
    value: RG-MENA-RO-HotPot-PRD
  - name: aksCluster
    value: aks-mena-ro-hotpot-prd
  - name: kubernetesNamespace
    value: ictd-hotpot-prd

stages:
  - stage: Build
    displayName: Build images
    jobs:
      - job: Client
        displayName: Build client image
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '18.x'
            displayName: Use Node 18

          - task: PowerShell@2
            displayName: Build client bundle
            inputs:
              targetType: inline
              pwsh: true
              script: |
                $ErrorActionPreference = 'Stop'
                npm install -g yarn
                Set-Location client
                yarn install --frozen-lockfile
                @"
                VITE_API_URL=$env:API_URL
                VITE_DIRECTUS_URL=$env:DIRECTUS_URL
                VITE_DIRECTUS_TOKEN=$env:DIRECTUS_TOKEN
                VITE_STORAGE_TYPE_ID=$env:STORAGE_TYPE_ID
                VITE_AUTH_PROVIDER=$env:AUTH_PROVIDER
                VITE_B2C_TENANT=$env:B2C_TENANT
                VITE_B2C_CLIENT_ID=$env:B2C_CLIENT_ID
                VITE_B2C_USER_FLOW=$env:B2C_USER_FLOW
                VITE_B2C_REDIRECT_URI=$env:B2C_REDIRECT_URI
                "@ | Out-File -FilePath .env -Encoding ascii
                npx tsc
                npx vite build
                Move-Item dist ../client-build
                Copy-Item deployment/Dockerfile ../client-build/
                Copy-Item deployment/nginx.conf ../client-build/
            env:
              API_URL: $(API_URL)
              DIRECTUS_URL: $(DIRECTUS_URL)
              DIRECTUS_TOKEN: $(DIRECTUS_TOKEN)
              STORAGE_TYPE_ID: $(STORAGE_TYPE_ID)
              AUTH_PROVIDER: $(AUTH_PROVIDER)
              B2C_TENANT: $(B2C_TENANT)
              B2C_CLIENT_ID: $(B2C_CLIENT_ID)
              B2C_USER_FLOW: $(B2C_USER_FLOW)
              B2C_REDIRECT_URI: $(B2C_REDIRECT_URI)

          - task: Docker@2
            displayName: Build & push client image
            inputs:
              containerRegistry: $(azureSubscription)
              repository: $(imageRepository)
              command: buildAndPush
              Dockerfile: client-build/Dockerfile
              buildContext: client-build
              tags: |
                client-$(imageTag)

      - job: Server
        displayName: Build server image
        steps:
          - task: UseDotNet@2
            inputs:
              version: '8.0.x'
            displayName: Use .NET 8 SDK

          - task: NodeTool@0
            inputs:
              versionSpec: '18.x'
            displayName: Use Node 18

          - task: PowerShell@2
            displayName: Build server bundle
            inputs:
              targetType: inline
              pwsh: true
              script: |
                $ErrorActionPreference = 'Stop'
                Set-Location server
                npm install
                npm run build
                Move-Item Ccd.Server/build ../server-build
                Copy-Item deployment/Dockerfile ../server-build/

          - task: Docker@2
            displayName: Build & push server image
            inputs:
              containerRegistry: $(azureSubscription)
              repository: $(imageRepository)
              command: buildAndPush
              Dockerfile: server-build/Dockerfile
              buildContext: server-build
              tags: |
                server-$(imageTag)

  - stage: Deploy
    displayName: Restart production deployments
    dependsOn: Build
    condition: succeeded()
    pool: 'MENA-HotPot Pipelines'
    jobs:
      - job: RestartDeployments
        displayName: Restart client and server
        steps:
          - checkout: none

          - task: Kubernetes@1
            displayName: Restart client and server deployments
            inputs:
              connectionType: Azure Resource Manager
              azureSubscriptionEndpoint: $(aksServiceConnection)
              azureResourceGroup: $(aksResourceGroup)
              kubernetesCluster: $(aksCluster)
              useClusterAdmin: true
              namespace: $(kubernetesNamespace)
              command: rollout
              arguments: restart deployment/hotpot-client deployment/hotpot-server

          - task: Kubernetes@1
            displayName: Wait for client rollout
            inputs:
              connectionType: Azure Resource Manager
              azureSubscriptionEndpoint: $(aksServiceConnection)
              azureResourceGroup: $(aksResourceGroup)
              kubernetesCluster: $(aksCluster)
              useClusterAdmin: true
              namespace: $(kubernetesNamespace)
              command: rollout
              arguments: status deployment/hotpot-client --timeout=5m

          - task: Kubernetes@1
            displayName: Wait for server rollout
            inputs:
              connectionType: Azure Resource Manager
              azureSubscriptionEndpoint: $(aksServiceConnection)
              azureResourceGroup: $(aksResourceGroup)
              kubernetesCluster: $(aksCluster)
              useClusterAdmin: true
              namespace: $(kubernetesNamespace)
              command: rollout
              arguments: status deployment/hotpot-server --timeout=5m
